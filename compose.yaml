name: english-app
services:
  app:
    image: english-app:local
    build: .
    restart: unless-stopped
    init: true
    env_file: backend/.env
    environment:
      DB_HOST: host.docker.internal
      HTTP_ADDR: :8080
      STATIC_DIR: /app/web
      GOMEMLIMIT: 192MiB
      GOMAXPROCS: 1
    ports:
      - '127.0.0.1:5180:8080'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '2'
