pid /tmp/nginx.pid;
worker_processes auto;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
 include /etc/nginx/mime.types;
 default_type application/octet-stream;
 access_log /dev/stdout;
 server_tokens off;
 sendfile on;
 client_body_temp_path /tmp/client_temp;
 proxy_temp_path /tmp/proxy_temp;
 fastcgi_temp_path /tmp/fastcgi_temp;
 uwsgi_temp_path /tmp/uwsgi_temp;
 scgi_temp_path /tmp/scgi_temp;
 resolver 127.0.0.11 valid=10s ipv6=off;
 map $http_upgrade $connection_upgrade { default upgrade; '' close; }
 upstream miva_backend {
  zone backend 64k;
  server backend:8080 resolve;
 }
 server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 12m;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;
  add_header X-Frame-Options DENY always;
  add_header Permissions-Policy "camera=(), microphone=(self)" always;
  location ~ /\. { deny all; }
  location /api/ {
   proxy_pass http://miva_backend;
   proxy_http_version 1.1;
   proxy_set_header Host $http_host;
   proxy_set_header X-Real-IP $remote_addr;
   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
   proxy_set_header X-Forwarded-Proto $scheme;
   proxy_set_header Upgrade $http_upgrade;
   proxy_set_header Connection $connection_upgrade;
   proxy_read_timeout 130s;
   proxy_send_timeout 130s;
   proxy_buffering off;
   proxy_hide_header X-Content-Type-Options;
   proxy_hide_header Referrer-Policy;
   proxy_hide_header X-Frame-Options;
   proxy_hide_header Permissions-Policy;
  }
  location = /healthz { proxy_pass http://miva_backend; proxy_connect_timeout 3s; proxy_read_timeout 5s; }
  location /assets/ { try_files $uri =404; expires 1y; add_header Cache-Control "public, immutable"; }
  location / { try_files $uri $uri/ /index.html; add_header Cache-Control no-cache; }
 }
}
